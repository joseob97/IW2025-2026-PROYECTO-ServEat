# ===============================
# APLICACIÓN
# ===============================
spring.application.name=Serveat

# Render expone el puerto mediante la variable PORT
server.port=${PORT}

# ===============================
# BASE DE DATOS (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# ===============================
# JPA / HIBERNATE
# ===============================
# En entorno remoto (Render) NO recreamos la BD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# VAADIN
# ===============================
vaadin.launch-browser=false
vaadin.whitelisted-packages=com.serveat

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.serveat=INFO
logging.level.org.springframework.security=INFO
logging.level.com.vaadin.flow.spring.security=INFO

# ===============================
# LOCALIZACIÓN
# ===============================
spring.web.locale=es_ES
spring.web.locale-resolver=fixed

# ===============================
# SUBIDA DE ARCHIVOS
# ===============================
app.upload.productos-path=uploads/images/productos
app.upload.productos-url=/images/productos

# ===============================
# EMAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=serveat2526@gmail.com
spring.mail.password=${SERVEAT_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# PERFIL ACTIVO
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
